services:
  postgres:
    image: postgres:16-alpine
    container_name: stackhr-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: stackhr_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stackhr-api
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3001}
      HOST: ${HOST:-0.0.0.0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/stackhr_dev?schema=public
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-development-secret-encryption-key-32b}
      AUTH_SECRET: ${AUTH_SECRET:-development-auth-secret-key-32b}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && node dist/src/main.js"

volumes:
  postgres_data:
