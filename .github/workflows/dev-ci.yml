name: Dev CI Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    name: Build, Lint & Test (Dev)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/stackhr_ci_db"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: yarn db:generate

      - name: Typecheck (TypeScript)
        run: yarn tsc --noEmit

      - name: Lint (ESLint)
        run: yarn lint

      - name: Run Unit Tests
        run: yarn test

      - name: Build Application
        run: yarn build
