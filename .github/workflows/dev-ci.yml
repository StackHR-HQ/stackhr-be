name: Dev CI Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    name: Build, Lint & Test (Dev)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/stackhr_ci_db"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint "src/**/*.ts"

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build
