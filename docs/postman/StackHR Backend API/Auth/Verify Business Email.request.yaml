$kind: http-request
description: Verify 6-digit email code and generate active session token.
url: "{{baseUrl}}/auth/business/verify-email"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "owner@company.com",
      "code": "123456"
    }
examples: ./.resources/Verify Business Email.resources/examples
order: 2000
